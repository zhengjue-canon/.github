<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 210" width="200" height="162">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#D4AF37" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="45%" stop-color="#D9AE42"/>
      <stop offset="100%" stop-color="#8C5E14"/>
    </linearGradient>
    <linearGradient id="indigoCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2D4A"/>
      <stop offset="60%" stop-color="#142038"/>
      <stop offset="100%" stop-color="#0C1424"/>
    </linearGradient>
    <linearGradient id="woodCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D2412"/>
      <stop offset="100%" stop-color="#211207"/>
    </linearGradient>
    <linearGradient id="pageLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBF5E6"/>
      <stop offset="85%" stop-color="#F5EBD3"/>
      <stop offset="100%" stop-color="#DECFA8"/>
    </linearGradient>
    <linearGradient id="pageRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DECFA8"/>
      <stop offset="15%" stop-color="#F5EBD3"/>
      <stop offset="100%" stop-color="#FBF5E6"/>
    </linearGradient>
  </defs>

  <!-- Soft ambient golden glow -->
  <circle cx="130" cy="108" r="102" fill="url(#halo)"/>

  <!-- Bottom stacked canonical wooden case (藏經楠木函匣底座) -->
  <rect x="18" y="176" width="224" height="16" rx="3" fill="url(#woodCase)" stroke="url(#gold)" stroke-width="1.4"/>
  <rect x="24" y="179" width="212" height="10" rx="1.5" fill="#F6EBD2" opacity="0.9"/>
  <line x1="24" y1="182.5" x2="236" y2="182.5" stroke="#C9B382" stroke-width="0.8"/>
  <line x1="24" y1="186" x2="236" y2="186" stroke="#C9B382" stroke-width="0.8"/>

  <!-- Upright Thread-Bound Canon Volume on Left (線裝《正覺藏》函冊，完整露出簽條與審定印) -->
  <g transform="translate(22, 18)">
    <!-- Book thickness / pages edge -->
    <rect x="6" y="0" width="106" height="154" rx="3" fill="#F5ECD7" stroke="#B59B6D" stroke-width="1"/>
    <!-- Deep Indigo Silk Cover (磁青絹面書衣) -->
    <rect x="0" y="4" width="106" height="154" rx="3" fill="url(#indigoCover)" stroke="url(#gold)" stroke-width="1.6"/>
    <!-- Golden Corner Protectors (灑金包角) -->
    <polygon points="0,4 15,4 0,19" fill="url(#gold)"/>
    <polygon points="0,158 15,158 0,143" fill="url(#gold)"/>
    <!-- Right Spine 4-Hole Thread Binding (古籍四眼線裝書脊) -->
    <line x1="92" y1="4" x2="92" y2="158" stroke="url(#gold)" stroke-width="1.1" opacity="0.75"/>
    <g stroke="#FAF3E0" stroke-width="1.8" stroke-linecap="round">
      <line x1="92" y1="26" x2="106" y2="26"/>
      <line x1="92" y1="62" x2="106" y2="62"/>
      <line x1="92" y1="98" x2="106" y2="98"/>
      <line x1="92" y1="134" x2="106" y2="134"/>
      <line x1="92" y1="4" x2="92" y2="158" stroke-width="1.3"/>
    </g>
    <!-- Vertical Xuan-Paper Title Slip (泥金書簽條：完整無遮擋) -->
    <rect x="14" y="16" width="34" height="126" rx="1.5" fill="#FBF4E2" stroke="url(#gold)" stroke-width="1.5"/>
    <rect x="17" y="19" width="28" height="120" fill="none" stroke="#B82920" stroke-width="0.7" opacity="0.75"/>
    <!-- Vertical Title Text: 正覺大藏經 -->
    <text x="31" y="38" text-anchor="middle" fill="#1C1208" font-family="Noto Serif CJK TC, Songti TC, PMingLiU, serif" font-size="14" font-weight="bold">正</text>
    <text x="31" y="55" text-anchor="middle" fill="#1C1208" font-family="Noto Serif CJK TC, Songti TC, PMingLiU, serif" font-size="14" font-weight="bold">覺</text>
    <text x="31" y="72" text-anchor="middle" fill="#1C1208" font-family="Noto Serif CJK TC, Songti TC, PMingLiU, serif" font-size="14" font-weight="bold">大</text>
    <text x="31" y="89" text-anchor="middle" fill="#1C1208" font-family="Noto Serif CJK TC, Songti TC, PMingLiU, serif" font-size="14" font-weight="bold">藏</text>
    <text x="31" y="106" text-anchor="middle" fill="#1C1208" font-family="Noto Serif CJK TC, Songti TC, PMingLiU, serif" font-size="14" font-weight="bold">經</text>
    <!-- Red Cinnabar Seal (朱砂審定印) -->
    <rect x="22" y="114" width="18" height="18" rx="1.5" fill="#B82920"/>
    <text x="31" y="126.5" text-anchor="middle" fill="#FFF8E7" font-family="Noto Serif CJK TC, serif" font-size="9.5" font-weight="bold">審定</text>
  </g>

  <!-- Foreground Open Sutra Volume with Red Rulings & Punctuation on Right-Front (展開之朱絲欄句讀經卷) -->
  <g transform="translate(92, 68)">
    <!-- Hardcover backing of open sutra -->
    <rect x="-4" y="4" width="148" height="104" rx="4" fill="url(#woodCase)" stroke="url(#gold)" stroke-width="1.5"/>
    <!-- Left Open Page -->
    <path d="M0,2 C28,0 56,2 70,8 L70,104 C56,98 28,96 0,98 Z" fill="url(#pageLeft)" stroke="#C8B282" stroke-width="1"/>
    <!-- Right Open Page -->
    <path d="M140,2 C112,0 84,2 70,8 L70,104 C84,98 112,96 140,98 Z" fill="url(#pageRight)" stroke="#C8B282" stroke-width="1"/>
    <!-- Inner Red Ruling Frame (朱絲欄邊框與界行) -->
    <rect x="8" y="11" width="54" height="78" fill="none" stroke="#C84B31" stroke-width="0.9" opacity="0.65"/>
    <line x1="26" y1="11" x2="26" y2="89" stroke="#C84B31" stroke-width="0.6" opacity="0.5"/>
    <line x1="44" y1="11" x2="44" y2="89" stroke="#C84B31" stroke-width="0.6" opacity="0.5"/>

    <rect x="78" y="11" width="54" height="78" fill="none" stroke="#C84B31" stroke-width="0.9" opacity="0.65"/>
    <line x1="96" y1="11" x2="96" y2="89" stroke="#C84B31" stroke-width="0.6" opacity="0.5"/>
    <line x1="114" y1="11" x2="114" y2="89" stroke="#C84B31" stroke-width="0.6" opacity="0.5"/>

    <!-- Vertical Sutra Ink Columns (經文墨跡) -->
    <g stroke="#2C1E12" stroke-width="2.2" stroke-linecap="round" opacity="0.82">
      <line x1="123" y1="18" x2="123" y2="38"/>
      <line x1="123" y1="46" x2="123" y2="76"/>
      <line x1="105" y1="18" x2="105" y2="52"/>
      <line x1="105" y1="60" x2="105" y2="82"/>
      <line x1="87" y1="18" x2="87" y2="42"/>
      <line x1="87" y1="50" x2="87" y2="78"/>
      <line x1="53" y1="18" x2="53" y2="48"/>
      <line x1="53" y1="56" x2="53" y2="80"/>
      <line x1="35" y1="18" x2="35" y2="36"/>
      <line x1="35" y1="44" x2="35" y2="74"/>
      <line x1="17" y1="18" x2="17" y2="58"/>
    </g>

    <!-- Cinnabar-Red Re-Punctuation Marks (朱筆新標句讀逗標) -->
    <g fill="#D12B1E">
      <circle cx="126" cy="42" r="2.1"/>
      <circle cx="126" cy="80" r="2.1"/>
      <circle cx="108" cy="56" r="2.1"/>
      <circle cx="90" cy="46" r="2.1"/>
      <circle cx="90" cy="82" r="2.1"/>
      <circle cx="56" cy="52" r="2.1"/>
      <circle cx="38" cy="40" r="2.1"/>
      <circle cx="38" cy="78" r="2.1"/>
      <circle cx="20" cy="63" r="2.1"/>
    </g>

    <!-- Center Fold & Cinnabar Bookmark Ribbon (書芯中縫與書籤) -->
    <line x1="70" y1="8" x2="70" y2="104" stroke="#8C6D3F" stroke-width="1.4"/>
    <path d="M68,98 L68,122 L70,117 L72,122 L72,98 Z" fill="#B82920"/>
  </g>
</svg>
