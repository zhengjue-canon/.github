<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="160" height="160">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B2410"/>
      <stop offset="70%" stop-color="#221409"/>
      <stop offset="100%" stop-color="#140B04"/>
    </radialGradient>
    <radialGradient id="outerHalo" cx="50%" cy="50%" r="50%">
      <stop offset="72%" stop-color="#E6C365" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E6C365" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4B8"/>
      <stop offset="45%" stop-color="#E5BC52"/>
      <stop offset="100%" stop-color="#9A6B16"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6"/>
      <stop offset="60%" stop-color="#E8C25E"/>
      <stop offset="100%" stop-color="#B38222"/>
    </linearGradient>
  </defs>

  <!-- Outer radiant aura -->
  <circle cx="110" cy="110" r="108" fill="url(#outerHalo)"/>

  <!-- Outer golden rim -->
  <circle cx="110" cy="110" r="98" fill="url(#goldGrad)"/>
  <circle cx="110" cy="110" r="92" fill="url(#bgGlow)"/>

  <!-- Decorative Dharma ring & lotus petals -->
  <circle cx="110" cy="110" r="86" fill="none" stroke="url(#goldGrad)" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.85"/>
  <circle cx="110" cy="110" r="78" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>

  <!-- 8 Spokes of the Dharma Wheel -->
  <g transform="translate(110, 110)" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.42">
    <line x1="0" y1="-78" x2="0" y2="78"/>
    <line x1="-78" y1="0" x2="78" y2="0"/>
    <line x1="-55" y1="-55" x2="55" y2="55"/>
    <line x1="-55" y1="55" x2="55" y2="-55"/>
  </g>

  <!-- Inner Head Halo (圓光) behind Bodhisattva -->
  <circle cx="110" cy="96" r="46" fill="none" stroke="url(#goldLight)" stroke-width="2" opacity="0.75"/>
  <circle cx="110" cy="96" r="41" fill="none" stroke="url(#goldLight)" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>

  <!-- Five-Buddha Golden Crown (五佛寶冠) & Bodhisattva Silhouette -->
  <g fill="url(#goldLight)">
    <!-- Crown base & jewels -->
    <path d="M84 78 C92 70, 128 70, 136 78 L133 84 C122 79, 98 79, 87 84 Z"/>
    <!-- Central Amitabha Spire -->
    <path d="M110 50 L116 66 L113 76 L107 76 L104 66 Z"/>
    <!-- Left & Right Crown Leaves -->
    <path d="M95 57 L102 69 L98 77 L91 75 Z"/>
    <path d="M125 57 L118 69 L122 77 L129 75 Z"/>
    <path d="M83 66 L91 74 L88 80 L81 77 Z"/>
    <path d="M137 66 L129 74 L132 80 L139 77 Z"/>
    <!-- Urna (眉間白毫) -->
    <circle cx="110" cy="91" r="2.2" fill="#FFFBE0"/>
  </g>

  <!-- Serene Bodhisattva Face & Dharma Robe Contours -->
  <g fill="none" stroke="url(#goldLight)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Face contour -->
    <path d="M89 84 C88 103, 96 118, 110 120 C124 118, 132 103, 131 84" stroke-width="2.4"/>
    <!-- Elongated compassionate ears -->
    <path d="M88 88 C82 90, 82 108, 88 114" stroke-width="2"/>
    <path d="M132 88 C138 90, 138 108, 132 114" stroke-width="2"/>
    <!-- Merciful downcast eyes & eyebrows -->
    <path d="M96 93 Q102 89 107 93" stroke-width="1.6"/>
    <path d="M113 93 Q118 89 124 93" stroke-width="1.6"/>
    <path d="M97 97 Q102 99 106 97" stroke-width="1.5"/>
    <path d="M114 97 Q118 99 123 97" stroke-width="1.5"/>
    <!-- Nose & gentle smile -->
    <path d="M110 95 L109 104 L111 105" stroke-width="1.5"/>
    <path d="M104 110 Q110 114 116 110" stroke-width="1.7"/>
    <!-- Shoulders & celestial robe (天衣瓔珞) -->
    <path d="M68 152 C74 134, 88 125, 101 122" stroke-width="2.5"/>
    <path d="M152 152 C146 134, 132 125, 119 122" stroke-width="2.5"/>
    <path d="M94 126 Q110 138 126 126" stroke-width="1.8"/>
    <path d="M85 134 Q110 150 135 134" stroke-width="1.4" stroke-dasharray="3 2"/>
  </g>

  <!-- Lotus Pedestal (八葉金蓮座) at Base -->
  <g fill="url(#goldGrad)" stroke="#221409" stroke-width="0.8">
    <path d="M110 144 C103 154, 103 166, 110 172 C117 166, 117 154, 110 144 Z"/>
    <path d="M96 147 C88 156, 91 168, 104 171 C99 162, 99 154, 96 147 Z"/>
    <path d="M124 147 C132 156, 129 168, 116 171 C121 162, 121 154, 124 147 Z"/>
    <path d="M82 153 C74 161, 80 171, 96 171 C88 165, 86 159, 82 153 Z"/>
    <path d="M138 153 C146 161, 140 171, 124 171 C132 165, 134 159, 138 153 Z"/>
  </g>

  <!-- Bottom Seal Text -->
  <text x="110" y="191" text-anchor="middle" fill="url(#goldLight)" font-family="Noto Serif CJK TC, Songti TC, PMingLiU, serif" font-size="14" font-weight="bold" letter-spacing="4">正覺大藏經</text>
</svg>
