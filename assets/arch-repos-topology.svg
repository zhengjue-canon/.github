<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A120B"/>
      <stop offset="50%" stop-color="#261A10"/>
      <stop offset="100%" stop-color="#140D07"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A6421"/>
      <stop offset="50%" stop-color="#E6C675"/>
      <stop offset="100%" stop-color="#8A6421"/>
    </linearGradient>
    <linearGradient id="cardDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D2013"/>
      <stop offset="100%" stop-color="#1F160C"/>
    </linearGradient>
    <linearGradient id="cardHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A2814"/>
      <stop offset="100%" stop-color="#25190C"/>
    </linearGradient>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D4AF37"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#9E8256"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="2" y="2" width="956" height="656" rx="12" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="2"/>
  <rect x="10" y="10" width="940" height="640" rx="8" fill="none" stroke="#D4AF37" stroke-opacity="0.22" stroke-width="1"/>

  <!-- Header -->
  <text x="480" y="34" text-anchor="middle" fill="#F0D58C" font-family="'Noto Serif TC','Songti TC','PMingLiU',serif" font-size="18" font-weight="bold" letter-spacing="1.2">《正覺藏》全局 8 大核心倉庫職責解耦與 AI 驅動架構拓撲圖 (v3.0 全私有孵化矩陣)</text>

  <!-- Layer 0: Governance, Docs, AI Specs & Roadmap Hub -->
  <rect x="26" y="46" width="908" height="76" rx="8" fill="#FFFFFF" fill-opacity="0.02" stroke="#F0D58C" stroke-opacity="0.45" stroke-width="1.2"/>
  <text x="40" y="63" fill="#F0D58C" font-family="sans-serif" font-size="11.5" font-weight="bold">第零層：全局文檔、Wiki、AI 可執行需求規格與排期中樞（Single Source of Truth）</text>
  <rect x="130" y="69" width="700" height="46" rx="6" fill="url(#cardHighlight)" stroke="#F0D58C" stroke-width="1.5"/>
  <rect x="720" y="75" width="98" height="16" rx="3" fill="#4A2E2B"/>
  <text x="769" y="87" text-anchor="middle" fill="#FADBD8" font-family="sans-serif" font-size="10" font-weight="bold">Private · 頂層中樞</text>
  <text x="146" y="88" fill="#FFF3D1" font-family="monospace,sans-serif" font-size="13.5" font-weight="bold">1. zhengjue-docs（全局文檔、考證報告、AI 需求卡 REQ/ADR 與 TODO 排期倉）</text>
  <text x="146" y="106" fill="#D9C39E" font-family="sans-serif" font-size="11">GLOSSARY.yaml 統一詞典  |  REQ-01~06 數學不變量規格  |  藏經編審凡例 Wiki  |  ROADMAP.md &amp; TODO.md</text>

  <!-- Layer 1: Underlying Compiler & Shared Core SDK -->
  <rect x="26" y="142" width="908" height="102" rx="8" fill="#FFFFFF" fill-opacity="0.02" stroke="#D4AF37" stroke-opacity="0.35" stroke-width="1"/>
  <text x="40" y="159" fill="#E6C675" font-family="sans-serif" font-size="11.5" font-weight="bold">第一層：底層無損轉換驗證引擎與跨四端共享協議底座（前期 Private，成熟後可開源）</text>

  <!-- Repo 2: cbeta-markdown -->
  <rect x="42" y="167" width="426" height="68" rx="6" fill="url(#cardHighlight)" stroke="#D4AF37" stroke-width="1.5"/>
  <rect x="352" y="173" width="106" height="16" rx="3" fill="#4A2E2B"/>
  <text x="405" y="185" text-anchor="middle" fill="#FADBD8" font-family="sans-serif" font-size="10" font-weight="bold">Private → MIT 開源</text>
  <text x="56" y="186" fill="#FFF3D1" font-family="monospace,sans-serif" font-size="13.5" font-weight="bold">2. cbeta-markdown（無損轉換與驗證引擎）</text>
  <text x="56" y="205" fill="#D9C39E" font-family="sans-serif" font-size="11">• CBETA XML ⇄ .cbeta.json 基準快照  • L0~L3 四級零丟失驗證器</text>
  <text x="56" y="222" fill="#D9C39E" font-family="sans-serif" font-size="11">• rebase 上游發版三路變基引擎  • docx2changes 存量 Word 差分導入</text>

  <!-- Repo 3: canon-core -->
  <rect x="492" y="167" width="426" height="68" rx="6" fill="url(#cardHighlight)" stroke="#D4AF37" stroke-width="1.5"/>
  <rect x="812" y="173" width="96" height="16" rx="3" fill="#4A2E2B"/>
  <text x="860" y="185" text-anchor="middle" fill="#FADBD8" font-family="sans-serif" font-size="10" font-weight="bold">Private · 核心 SDK</text>
  <text x="506" y="186" fill="#FFF3D1" font-family="monospace,sans-serif" font-size="13.5" font-weight="bold">3. canon-core（跨四端共享協議與重放內核）</text>
  <text x="506" y="205" fill="#D9C39E" font-family="sans-serif" font-size="11">• @zhengjue/standoff &amp; ledger：CJK 安全尋址與 ChangeLedger 重放器</text>
  <text x="506" y="222" fill="#D9C39E" font-family="sans-serif" font-size="11">• @zhengjue/schema &amp; api-client：8 種雙層正交字型與 Zod 契約</text>

  <!-- Layer 2: Corpus Repo -->
  <rect x="26" y="266" width="908" height="86" rx="8" fill="#FFFFFF" fill-opacity="0.02" stroke="#D4AF37" stroke-opacity="0.35" stroke-width="1"/>
  <text x="40" y="283" fill="#E6C675" font-family="sans-serif" font-size="11.5" font-weight="bold">第二層：千年數位藏經資產與全量變更帳本主倉（五位一體可逆溯源存儲）</text>

  <!-- Repo 4: zhengjue-corpus -->
  <rect x="130" y="290" width="700" height="54" rx="6" fill="url(#cardDark)" stroke="#D4AF37" stroke-width="1.5"/>
  <rect x="720" y="296" width="98" height="16" rx="3" fill="#4A2E2B"/>
  <text x="769" y="308" text-anchor="middle" fill="#FADBD8" font-family="sans-serif" font-size="10" font-weight="bold">Private · 語料主倉</text>
  <text x="146" y="309" fill="#FFF3D1" font-family="monospace,sans-serif" font-size="13.5" font-weight="bold">4. zhengjue-corpus（《正覺藏》語料、全量改動帳本與評審專文主倉）</text>
  <text x="146" y="329" fill="#D9C39E" font-family="sans-serif" font-size="11">*.cbeta.json (原始基準) + *.changes.jsonl (全過程改動帳本) + articles/*.md (修改意見長文) ⇒ *.md &amp; *.standoff.json</text>

  <!-- Layer 3: Backend Service -->
  <rect x="26" y="374" width="908" height="84" rx="8" fill="#FFFFFF" fill-opacity="0.02" stroke="#D4AF37" stroke-opacity="0.35" stroke-width="1"/>
  <text x="40" y="391" fill="#E6C675" font-family="sans-serif" font-size="11.5" font-weight="bold">第三層：後端核心服務與檢索引擎調度中心</text>

  <!-- Repo 5: zhengjue-server -->
  <rect x="130" y="398" width="700" height="52" rx="6" fill="url(#cardDark)" stroke="#C29B48" stroke-width="1.5"/>
  <rect x="720" y="404" width="98" height="16" rx="3" fill="#4A2E2B"/>
  <text x="769" y="416" text-anchor="middle" fill="#FADBD8" font-family="sans-serif" font-size="10" font-weight="bold">Private · 核心服務</text>
  <text x="146" y="417" fill="#FFF3D1" font-family="monospace,sans-serif" font-size="13.5" font-weight="bold">5. zhengjue-server（Fastify 5 + PostgreSQL 16 + Meilisearch）</text>
  <text x="146" y="437" fill="#D9C39E" font-family="sans-serif" font-size="11">PG int4range 空間區間索引  |  全過程改動與評審專文 API  |  我的評審中心 API  |  繁簡雙索引與 Git 自動簽核</text>

  <!-- Layer 4: Three Client Repos -->
  <rect x="26" y="480" width="908" height="162" rx="8" fill="#FFFFFF" fill-opacity="0.02" stroke="#D4AF37" stroke-opacity="0.35" stroke-width="1"/>
  <text x="40" y="497" fill="#E6C675" font-family="sans-serif" font-size="11.5" font-weight="bold">第四層：三大終端應用倉（前後端分離 + 本地 /home/shubuzuo/code/zhengjue 頂層 pnpm-workspace 聯調）</text>

  <!-- Repo 6: zhengjue-admin -->
  <rect x="42" y="506" width="284" height="122" rx="6" fill="url(#cardDark)" stroke="#C29B48" stroke-width="1.3"/>
  <rect x="242" y="512" width="76" height="16" rx="3" fill="#4A2E2B"/>
  <text x="280" y="524" text-anchor="middle" fill="#FADBD8" font-family="sans-serif" font-size="10" font-weight="bold">Private 內網</text>
  <text x="54" y="525" fill="#FFF3D1" font-family="monospace,sans-serif" font-size="13" font-weight="bold">6. zhengjue-admin</text>
  <text x="54" y="542" fill="#E6C675" font-family="sans-serif" font-size="11" font-weight="bold">編審工作台 Studio + 管理後台 Admin</text>
  <text x="54" y="560" fill="#D9C39E" font-family="sans-serif" font-size="10.6">• 同修初標台 &amp; 平實導師大字號極簡審定台</text>
  <text x="54" y="577" fill="#FFF3D1" font-family="sans-serif" font-size="10.6">• 評審時同屏直接撰寫 Markdown 專文</text>
  <text x="54" y="594" fill="#FFF3D1" font-family="sans-serif" font-size="10.6">• 【我的評審與文章中心】事後回溯補充長文</text>
  <text x="54" y="611" fill="#D9C39E" font-family="sans-serif" font-size="10.6">• 存量 .docx 差分導入核對 &amp; 質疑審校後台</text>

  <!-- Repo 7: zhengjue-web -->
  <rect x="338" y="506" width="284" height="122" rx="6" fill="url(#cardDark)" stroke="#D4AF37" stroke-width="1.3"/>
  <rect x="534" y="512" width="80" height="16" rx="3" fill="#4A2E2B"/>
  <text x="574" y="524" text-anchor="middle" fill="#FADBD8" font-family="sans-serif" font-size="10" font-weight="bold">Private → 公網</text>
  <text x="350" y="525" fill="#FFF3D1" font-family="monospace,sans-serif" font-size="13" font-weight="bold">7. zhengjue-web</text>
  <text x="350" y="542" fill="#E6C675" font-family="sans-serif" font-size="11" font-weight="bold">在線藏經閣與全透明溯源共創 Web 端</text>
  <text x="350" y="560" fill="#D9C39E" font-family="sans-serif" font-size="10.6">• Next.js 15 SSG/ISR 高併發點閱 (訂正字入正文)</text>
  <text x="350" y="577" fill="#FFF3D1" font-family="sans-serif" font-size="10.6">• 全過程改動歷史、更改人、審閱人透明展示</text>
  <text x="350" y="594" fill="#FFF3D1" font-family="sans-serif" font-size="10.6">• 點擊任意改動展開閱讀完整 Markdown 專文</text>
  <text x="350" y="611" fill="#D9C39E" font-family="sans-serif" font-size="10.6">• 8 種字型排版、旁批軌道、劃詞質疑/提問</text>

  <!-- Repo 8: zhengjue-mobile -->
  <rect x="634" y="506" width="284" height="122" rx="6" fill="url(#cardDark)" stroke="#C29B48" stroke-width="1.3"/>
  <rect x="830" y="512" width="80" height="16" rx="3" fill="#284B63"/>
  <text x="870" y="524" text-anchor="middle" fill="#E3F2FD" font-family="sans-serif" font-size="10" font-weight="bold">iOS / Android</text>
  <text x="646" y="525" fill="#FFF3D1" font-family="monospace,sans-serif" font-size="13" font-weight="bold">8. zhengjue-mobile</text>
  <text x="646" y="542" fill="#E6C675" font-family="sans-serif" font-size="11" font-weight="bold">手機與 iPad 平板離線精讀/審閱 App</text>
  <text x="646" y="560" fill="#D9C39E" font-family="sans-serif" font-size="10.6">• Expo + SQLite FTS5 本地離線全藏秒搜</text>
  <text x="646" y="577" fill="#D9C39E" font-family="sans-serif" font-size="10.6">• 離線查看全過程改動溯源與評審辨正專文</text>
  <text x="646" y="594" fill="#FFF3D1" font-family="sans-serif" font-size="10.6">• iPad 平板導師/親教師大字號觸控審閱模式</text>
  <text x="646" y="611" fill="#D9C39E" font-family="sans-serif" font-size="10.6">• 護眼宣紙閱讀、書籤筆記雲同步、長按提問</text>

  <!-- Orthogonal Arrows -->
  <path d="M 380 115 L 380 165" fill="none" stroke="#9E8256" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrowMuted)"/>
  <path d="M 620 115 L 620 165" fill="none" stroke="#9E8256" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrowMuted)"/>
  <text x="415" y="135" fill="#E6C675" font-family="sans-serif" font-size="10.5">REQ 規格卡 + AGENTS.md 驅動全倉 AI 開發</text>

  <path d="M 380 235 L 380 288" fill="none" stroke="#D4AF37" stroke-width="1.8" marker-end="url(#arrowGold)"/>
  <text x="390" y="258" fill="#E6C675" font-family="sans-serif" font-size="10.5">生成基準 &amp; 確定性狀態重放校驗</text>

  <path d="M 660 235 L 660 288" fill="none" stroke="#9E8256" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#arrowMuted)"/>
  <text x="670" y="258" fill="#B59B72" font-family="sans-serif" font-size="10.5">共享 @zhengjue/* 協議與重放算法</text>

  <path d="M 480 344 L 480 396" fill="none" stroke="#D4AF37" stroke-width="1.8" marker-start="url(#arrowGold)" marker-end="url(#arrowGold)"/>
  <text x="492" y="366" fill="#E6C675" font-family="sans-serif" font-size="10.5">Git 簽核持久化 (changes.jsonl + articles/*.md)</text>

  <path d="M 320 450 L 320 504" fill="none" stroke="#D4AF37" stroke-width="1.6" marker-end="url(#arrowGold)"/>
  <path d="M 480 450 L 480 504" fill="none" stroke="#D4AF37" stroke-width="1.6" marker-end="url(#arrowGold)"/>
  <path d="M 680 450 L 680 504" fill="none" stroke="#D4AF37" stroke-width="1.6" marker-end="url(#arrowGold)"/>
  <text x="492" y="471" fill="#E6C675" font-family="sans-serif" font-size="10.5">OpenAPI 3.1 / 評審長文同步 / 離線增量包分發</text>
</svg>
